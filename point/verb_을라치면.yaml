name: (으)ㄹ라치면
definitions:
  - slug: whenever
    name: Whenever
    english_alternatives: Whenever, every time
    meaning: Expresses that every time some action tries to happen, it results in another action to happen. Equivalent to -으려고 할 때마다 or -으려고 하면.
    examples:
      - sentence: 무슨 BL 드라마를 <f>볼라치면</f> 어머니가 내 방에 들어오셔.
        type: simple
        translated: Whenever I try to watch some BL drama, my mom comes into my room.
        audio_url: https://r2.kimchi-reader.app/grammar/무슨_BL_드라마를_볼라치면_어머니가_내_방에_들어오셔__2026-07-28.mp3
      - sentence: 분위기가 <f>어색할라치면</f> 얘가 재밌는 농담을 하거든.
        type: simple
        translated: Every time the atmosphere becomes awkward he cracks a funny joke, y'know.
        audio_url: https://r2.kimchi-reader.app/grammar/분위기가_어색할라치면_얘가_재밌는_농담을_하거든__2026-07-28.mp3
      - sentence: 공부를 <f>할라치면</f> 친구가 카톡을 보내요...
        type: simple
        translated: Every time I study, my friend sends me a message on KakaoTalk.
        audio_url: https://r2.kimchi-reader.app/grammar/공부를_할라치면_친구가_카톡을_보내요__2026-07-28.mp3
